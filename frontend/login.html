<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>AKINEX SWOP - Login</title>
    
    <!-- PWA Support -->
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AKINEX SWOP">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <meta name="theme-color" content="#F40009">
    
    <style>
        /* ============================================================
           LIGHT MODE
           ============================================================ */
        :root {
            --bg-body: #f0f2f5;
            --bg-card: rgba(255, 255, 255, 0.92);
            --bg-gradient-start: rgba(10, 10, 26, 0.7);
            --bg-gradient-end: rgba(26, 26, 46, 0.85);
            --text-primary: #1a1a2e;
            --text-secondary: #555555;
            --text-light: #888888;
            --text-lighter: #aaaaaa;
            --border-color: #e8e8e8;
            --shadow: 0 20px 60px rgba(0,0,0,0.15);
            --input-bg: rgba(255, 255, 255, 0.9);
            --input-border: #e0e0e0;
            --button-gradient: linear-gradient(135deg, #F40009 0%, #CC0000 100%);
            --error-bg: #fde8ea;
            --error-text: #c62828;
            --info-bg: #e3f2fd;
            --info-text: #0d47a1;
            --brand-primary: #F40009;
            --brand-secondary: #CC0000;
            --brand-gold: #D4A843;
            /* Logo Colors - Monochrome */
            --logo-main-color: #1a1a2e;
            --logo-sub-color: #666666;
            --logo-slogan-color: #999999;
            --card-border: rgba(255,255,255,0.3);
        }

        /* ============================================================
           DARK MODE
           ============================================================ */
        [data-theme="dark"] {
            --bg-body: #0a0a1a;
            --bg-card: rgba(22, 22, 46, 0.92);
            --bg-gradient-start: rgba(10, 10, 26, 0.7);
            --bg-gradient-end: rgba(22, 22, 46, 0.85);
            --text-primary: #e8e8e8;
            --text-secondary: #aaaaaa;
            --text-light: #777777;
            --text-lighter: #555555;
            --border-color: #2a2a4a;
            --shadow: 0 20px 60px rgba(0,0,0,0.5);
            --input-bg: rgba(34, 34, 74, 0.9);
            --input-border: #333366;
            --button-gradient: linear-gradient(135deg, #F40009 0%, #CC0000 100%);
            --error-bg: #2a1a1a;
            --error-text: #ff6b6b;
            --info-bg: #1a2a4a;
            --info-text: #8ab4f8;
            --brand-primary: #F40009;
            --brand-secondary: #CC0000;
            --brand-gold: #D4A843;
            /* Logo Colors - Monochrome (Dark Mode) */
            --logo-main-color: #ffffff;
            --logo-sub-color: rgba(255,255,255,0.6);
            --logo-slogan-color: rgba(255,255,255,0.4);
            --card-border: rgba(255,255,255,0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s ease;
            padding: 20px;
            
            /* Background Image - Optional */
            background-image: url('bg-login.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* Fallback gradient if image fails to load */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            z-index: 0;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
        }

        .login-container {
            background: var(--bg-card);
            padding: 35px 30px 28px 30px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            transition: background 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
        }

        /* Premium Accent Bar */
        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--brand-primary), var(--brand-gold), var(--brand-primary));
            background-size: 200% 100%;
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* ============================================================
           HEADER - LOGO TOP LEFT | THEME TOGGLE TOP RIGHT
           ============================================================ */
        .login-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 4px;
        }

        /* ============================================================
           LOGO - EXACT MONOCHROME COPY
           ============================================================ */
        .login-logo {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }

        .login-logo .logo-main {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 4px;
            color: var(--logo-main-color);
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        .login-logo .logo-sub {
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 6px;
            color: var(--logo-sub-color);
            text-transform: uppercase;
            margin-top: 1px;
            transition: color 0.3s ease;
        }

        /* ============================================================
           SLOGAN - UNDER LOGO
           ============================================================ */
        .login-slogan {
            font-size: 9px;
            font-weight: 300;
            letter-spacing: 2px;
            color: var(--logo-slogan-color);
            text-transform: uppercase;
            margin-top: 4px;
            transition: color 0.3s ease;
        }

        /* Theme Toggle - Top Right */
        .theme-toggle-wrapper {
            flex-shrink: 0;
            margin-left: 10px;
            margin-top: 2px;
        }

        .theme-toggle {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.08);
            cursor: pointer;
            font-size: 16px;
            color: var(--text-secondary);
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.3s ease;
            width: auto;
            margin: 0;
        }

        .theme-toggle:hover {
            background: var(--border-color);
            opacity: 0.8;
        }

        /* Divider */
        .brand-divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 16px 0 20px 0;
        }

        .brand-divider::before,
        .brand-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-color), transparent);
        }

        .brand-divider .divider-icon {
            color: var(--brand-primary);
            font-size: 12px;
            opacity: 0.5;
        }

        /* ============================================================
           CENTER CONTENT
           ============================================================ */
        .login-center {
            text-align: center;
        }

        .login-center .product-name {
            font-size: 22px;
            font-weight: 400;
            color: var(--text-primary);
            letter-spacing: 0.5px;
            transition: color 0.3s ease;
        }

        .login-center .product-tagline {
            font-size: 13px;
            font-weight: 300;
            color: var(--text-secondary);
            margin-top: 8px;
            letter-spacing: 0.3px;
            transition: color 0.3s ease;
        }

        .login-center .product-tagline .dot {
            color: var(--brand-primary);
            font-weight: 700;
            margin: 0 4px;
        }

        /* Portal Badge */
        .portal-badge {
            text-align: center;
            margin: 20px 0 14px 0;
            padding: 6px 14px;
            background: var(--border-color);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
            transition: background 0.3s ease, color 0.3s ease;
            display: inline-block;
            width: 100%;
        }

        .portal-badge i {
            margin-right: 6px;
        }

        .portal-super-admin { 
            background: #dc3545; 
            color: white; 
        }
        .portal-manager { 
            background: #ffc107; 
            color: #333; 
        }
        .portal-sales { 
            background: #28a745; 
            color: white; 
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 20px;
            font-size: 13px;
            font-weight: 300;
            transition: color 0.3s ease;
        }

        /* ============================================================
           FORM
           ============================================================ */
        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
            font-size: 12px;
            color: var(--text-primary);
            transition: color 0.3s ease;
        }

        label i {
            margin-right: 6px;
            color: var(--brand-primary);
            width: 14px;
        }

        input {
            width: 100%;
            padding: 11px 14px;
            border: 2px solid var(--input-border);
            border-radius: 10px;
            font-size: 14px;
            background: var(--input-bg);
            color: var(--text-primary);
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 4px rgba(244, 0, 9, 0.1);
            background: var(--bg-card);
        }

        input::placeholder {
            color: var(--text-light);
            opacity: 0.6;
        }

        /* ============================================================
           LOGIN BUTTON
           ============================================================ */
        .login-btn {
            width: 100%;
            padding: 13px;
            background: var(--button-gradient);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 6px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .login-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.6s ease;
        }

        .login-btn:hover::after {
            left: 100%;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(244, 0, 9, 0.35);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .login-btn i {
            font-size: 16px;
        }

        /* ============================================================
           MESSAGES
           ============================================================ */
        .error-msg, .info-msg {
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 14px;
            display: none;
            font-size: 13px;
            font-weight: 500;
        }

        .error-msg {
            background: var(--error-bg);
            color: var(--error-text);
            border-left: 4px solid #dc3545;
        }

        .info-msg {
            background: var(--info-bg);
            color: var(--info-text);
            border-left: 4px solid #17a2b8;
        }

        .twofa-group {
            display: none;
        }

        /* ============================================================
           FOOTER
           ============================================================ */
        .login-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid var(--border-color);
            transition: border-color 0.3s ease;
        }

        .login-footer .company {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .login-footer .company strong {
            color: var(--brand-primary);
            font-weight: 700;
        }

        .login-footer .version {
            display: block;
            margin-top: 3px;
            font-size: 10px;
            color: var(--text-light);
            letter-spacing: 0.5px;
        }

        .login-footer .version span {
            color: var(--brand-primary);
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 480px) {
            .login-container {
                padding: 25px 18px 20px 18px;
                border-radius: 14px;
            }

            .login-logo .logo-main {
                font-size: 17px;
                letter-spacing: 3px;
            }

            .login-logo .logo-sub {
                font-size: 8px;
                letter-spacing: 4px;
            }

            .login-slogan {
                font-size: 8px;
                letter-spacing: 1.5px;
            }

            .login-center .product-name {
                font-size: 18px;
            }

            .login-center .product-tagline {
                font-size: 11px;
            }

            .login-btn {
                padding: 12px;
                font-size: 14px;
            }

            input {
                padding: 10px 12px;
                font-size: 13px;
            }

            .portal-badge {
                font-size: 11px;
                padding: 5px 12px;
            }

            .brand-divider {
                margin: 12px 0 16px 0;
            }
        }

        @media (max-width: 380px) {
            .login-logo .logo-main {
                font-size: 15px;
                letter-spacing: 2px;
            }

            .login-logo .logo-sub {
                font-size: 7px;
                letter-spacing: 3px;
            }

            .login-slogan {
                font-size: 7px;
                letter-spacing: 1px;
            }

            .login-center .product-name {
                font-size: 16px;
            }

            .login-center .product-tagline {
                font-size: 10px;
            }
        }

        @media (hover: none) and (pointer: coarse) {
            button, input {
                min-height: 44px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">

        <div class="login-container">

            <!-- ============================================================
                 HEADER - LOGO TOP LEFT | THEME TOGGLE TOP RIGHT
                 ============================================================ -->
            <div class="login-header">

                <!-- ============================================================
                     LOGO - EXACT MONOCHROME COPY
                     ============================================================ -->
                <div class="login-logo">
                    <div class="logo-main">AKINEX</div>
                    <div class="logo-sub">TECHNOLOGIES</div>
                    <div class="login-slogan">ENGINEERING SMARTER BUSINESS OPERATIONS</div>
                </div>

                <!-- Theme Toggle - Top Right -->
                <div class="theme-toggle-wrapper">
                    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
                        <span id="themeIcon">🌙</span>
                    </button>
                </div>

            </div>

            <!-- Divider -->
            <div class="brand-divider">
                <span class="divider-icon">◆</span>
            </div>

            <!-- ============================================================
                 CENTER CONTENT
                 ============================================================ -->
            <div class="login-center">

                <!-- Product Name - Clear, Not Bold -->
                <div class="product-name">Smart Warehouse Operations Platform</div>

                <!-- Tagline -->
                <div class="product-tagline">
                    Real-time Inventory <span class="dot">•</span> Sales Tracking <span class="dot">•</span> Cash Reconciliation
                </div>

                <!-- Portal Badge -->
                <div class="portal-badge" id="portalBadge">
                    <i class="fas fa-shield-alt"></i> Loading...
                </div>

                <!-- Subtitle -->
                <div class="subtitle" id="portalSubtitle">Enter your credentials to continue</div>

                <!-- Messages -->
                <div id="errorMsg" class="error-msg"></div>
                <div id="infoMsg" class="info-msg"></div>

                <!-- Login Form -->
                <form id="loginForm">
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Username</label>
                        <input type="text" id="username" placeholder="Enter your username" required autocomplete="off">
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Password</label>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>

                    <div class="form-group twofa-group" id="twofaGroup">
                        <label><i class="fas fa-key"></i> 2FA Secret Code</label>
                        <input type="password" id="twofaCode" placeholder="Enter your 2FA secret code">
                    </div>

                    <button type="submit" class="login-btn" id="loginBtn">
                        <i class="fas fa-sign-in-alt"></i> Sign In
                    </button>
                </form>

            </div>

            <!-- ============================================================
                 FOOTER
                 ============================================================ -->
            <div class="login-footer">
                <div class="company">
                    <strong>AKINEX SWOP</strong> &mdash; Smart Warehouse Operations Platform
                </div>
                <div class="version">
                    v2.0 &bull; <span>Secure</span> &bull; Real-Time
                </div>
            </div>

        </div>

    </div>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        const API_URL = 'https://warehouse-backend-new-u9rq.onrender.com/api';
        
        let redirectPortal = 'sales';
        let twofaSessionId = null;
        let isTwoFAMode = false;
        
        // ============================================================
        // HYBRID DARK MODE
        // ============================================================
        function getSystemTheme() {
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function getCurrentTheme() {
            const saved = localStorage.getItem('theme');
            if (saved) return saved;
            return getSystemTheme();
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            const icon = document.getElementById('themeIcon');
            if (icon) {
                icon.textContent = theme === 'dark' ? '☀️' : '🌙';
            }
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            const newTheme = current === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', newTheme);
            applyTheme(newTheme);
        }

        applyTheme(getCurrentTheme());

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            const saved = localStorage.getItem('theme');
            if (!saved) {
                applyTheme(e.matches ? 'dark' : 'light');
            }
        });
        
        // ============================================================
        // PORTAL DETECTION
        // ============================================================
        const urlParams = new URLSearchParams(window.location.search);
        const redirectParam = urlParams.get('redirect');
        
        if (redirectParam === 'super-admin') {
            redirectPortal = 'super-admin';
        } else if (redirectParam === 'manager-dashboard') {
            redirectPortal = 'manager';
        } else {
            const referrer = document.referrer;
            if (referrer.includes('super-admin')) {
                redirectPortal = 'super-admin';
            } else if (referrer.includes('manager-dashboard')) {
                redirectPortal = 'manager';
            } else {
                redirectPortal = 'sales';
            }
        }
        
        const portalBadge = document.getElementById('portalBadge');
        const portalSubtitle = document.getElementById('portalSubtitle');
        
        switch(redirectPortal) {
            case 'super-admin':
                portalBadge.innerHTML = '🔐 SUPER ADMIN PORTAL';
                portalBadge.className = 'portal-badge portal-super-admin';
                portalSubtitle.innerHTML = 'Enter your credentials to access the admin panel';
                break;
            case 'manager':
                portalBadge.innerHTML = '📊 WAREHOUSE MANAGER PORTAL';
                portalBadge.className = 'portal-badge portal-manager';
                portalSubtitle.innerHTML = 'Enter your credentials to manage warehouse operations';
                break;
            default:
                portalBadge.innerHTML = '💰 SALES TEAM PORTAL';
                portalBadge.className = 'portal-badge portal-sales';
                portalSubtitle.innerHTML = 'Enter your credentials to start selling';
        }
        
        // ============================================================
        // LOGIN SUBMIT
        // ============================================================
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const twofaCode = document.getElementById('twofaCode').value;
            const errorDiv = document.getElementById('errorMsg');
            const infoDiv = document.getElementById('infoMsg');
            const loginBtn = document.getElementById('loginBtn');
            
            errorDiv.style.display = 'none';
            infoDiv.style.display = 'none';
            
            if (isTwoFAMode) {
                if (!twofaCode) {
                    errorDiv.textContent = '⚠️ Please enter your 2FA secret code';
                    errorDiv.style.display = 'block';
                    return;
                }
                
                try {
                    loginBtn.disabled = true;
                    loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying 2FA...';
                    
                    const response = await fetch(`${API_URL}/auth/verify-2fa`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sessionId: twofaSessionId, secretCode: twofaCode })
                    });
                    
                    const data = await response.json();
                    
                    if (!data.success) {
                        errorDiv.textContent = data.message || '2FA verification failed';
                        errorDiv.style.display = 'block';
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = '<i class="fas fa-key"></i> Verify 2FA Code';
                        return;
                    }
                    
                    if (data.token) {
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('user', JSON.stringify(data.user));
                        window.location.href = data.redirectUrl;
                    }
                    
                } catch (error) {
                    errorDiv.textContent = 'Network error. Please try again.';
                    errorDiv.style.display = 'block';
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-key"></i> Verify 2FA Code';
                }
                return;
            }
            
            try {
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
                
                const response = await fetch(`${API_URL}/auth/login-portal`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, portal: redirectPortal })
                });

                const data = await response.json();

                if (!data.success) {
                    errorDiv.textContent = data.message || 'Login failed. Please check your credentials.';
                    errorDiv.style.display = 'block';
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
                    return;
                }
                
                if (data.requiresTwoFA && data.sessionId) {
                    isTwoFAMode = true;
                    twofaSessionId = data.sessionId;
                    document.getElementById('twofaGroup').style.display = 'block';
                    infoDiv.textContent = '🔐 Two-factor authentication required. Enter your secret code to continue.';
                    infoDiv.style.display = 'block';
                    loginBtn.innerHTML = '<i class="fas fa-key"></i> Verify 2FA Code';
                    loginBtn.disabled = false;
                    return;
                }
                
                if (data.token) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = data.redirectUrl;
                }
                
            } catch (error) {
                errorDiv.textContent = 'Network error. Please try again.';
                errorDiv.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
            }
        });
        
        // ============================================================
        // PWA SERVICE WORKER
        // ============================================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker registered:', reg))
                    .catch(err => console.error('Service Worker registration failed:', err));
            });
        }
    </script>
