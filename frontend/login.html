<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Login - Warehouse Stock System</title>
    
    <!-- PWA Support -->
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WMS">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <meta name="theme-color" content="#1a1a2e">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            margin: 20px;
        }
        .login-container h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        .portal-badge {
            text-align: center;
            margin-bottom: 20px;
            padding: 8px;
            background: #f0f0f0;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        .portal-super-admin { background: #dc3545; color: white; }
        .portal-manager { background: #ffc107; color: #333; }
        .portal-sales { background: #28a745; color: white; }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #555;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        button:hover {
            opacity: 0.9;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error-msg {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        .info-msg {
            background: #cce5ff;
            color: #004085;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        .logo {
            text-align: center;
            font-size: 48px;
            margin-bottom: 20px;
        }
        .twofa-group {
            display: none;
        }
        @media (max-width: 480px) {
            .login-container {
                padding: 25px;
                margin: 15px;
            }
            .logo {
                font-size: 48px;
            }
            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🏭</div>
        <div class="portal-badge" id="portalBadge">Loading...</div>
        <h1>Warehouse Stock System</h1>
        <div class="subtitle" id="portalSubtitle">Enter your credentials</div>
        <div id="errorMsg" class="error-msg"></div>
        <div id="infoMsg" class="info-msg"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required autocomplete="off">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <div class="form-group twofa-group" id="twofaGroup">
                <label>2FA Secret Code (Super Admin only)</label>
                <input type="password" id="twofaCode" placeholder="Enter your secret code">
            </div>
            <button type="submit" id="loginBtn">Login</button>
        </form>
    </div>

    <script>
        const API_URL = 'https://warehouse-backend-new-u9rq.onrender.com/api';
        
        let redirectPortal = 'sales';
        let twofaSessionId = null;
        let isTwoFAMode = false;
        
        // Determine which portal we are trying to access
        const urlParams = new URLSearchParams(window.location.search);
        const redirectParam = urlParams.get('redirect');
        
        if (redirectParam === 'super-admin') {
            redirectPortal = 'super-admin';
        } else if (redirectParam === 'manager-dashboard') {
            redirectPortal = 'manager';
        } else {
            const referrer = document.referrer;
            if (referrer.includes('super-admin')) {
                redirectPortal = 'super-admin';
            } else if (referrer.includes('manager-dashboard')) {
                redirectPortal = 'manager';
            } else {
                redirectPortal = 'sales';
            }
        }
        
        // Update UI based on portal
        const portalBadge = document.getElementById('portalBadge');
        const portalSubtitle = document.getElementById('portalSubtitle');
        
        switch(redirectPortal) {
            case 'super-admin':
                portalBadge.innerHTML = '🔐 SUPER ADMIN PORTAL';
                portalBadge.className = 'portal-badge portal-super-admin';
                portalSubtitle.innerHTML = 'Enter your credentials';
                break;
            case 'manager':
                portalBadge.innerHTML = '📊 WAREHOUSE MANAGER PORTAL';
                portalBadge.className = 'portal-badge portal-manager';
                portalSubtitle.innerHTML = 'Enter your credentials';
                break;
            default:
                portalBadge.innerHTML = '💰 SALES TEAM PORTAL';
                portalBadge.className = 'portal-badge portal-sales';
                portalSubtitle.innerHTML = 'Enter your credentials';
        }
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const twofaCode = document.getElementById('twofaCode').value;
            const errorDiv = document.getElementById('errorMsg');
            const infoDiv = document.getElementById('infoMsg');
            const loginBtn = document.getElementById('loginBtn');
            
            errorDiv.style.display = 'none';
            infoDiv.style.display = 'none';
            
            // If we're in 2FA mode, handle 2FA verification
            if (isTwoFAMode) {
                if (!twofaCode) {
                    errorDiv.textContent = 'Please enter your 2FA secret code';
                    errorDiv.style.display = 'block';
                    return;
                }
                
                try {
                    loginBtn.disabled = true;
                    loginBtn.textContent = 'Verifying 2FA...';
                    
                    const response = await fetch(`${API_URL}/auth/verify-2fa`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sessionId: twofaSessionId, secretCode: twofaCode })
                    });
                    
                    const data = await response.json();
                    
                    if (!data.success) {
                        errorDiv.textContent = data.message || '2FA verification failed';
                        errorDiv.style.display = 'block';
                        loginBtn.disabled = false;
                        loginBtn.textContent = 'Verify 2FA Code';
                        return;
                    }
                    
                    if (data.token) {
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('user', JSON.stringify(data.user));
                        window.location.href = data.redirectUrl;
                    }
                    
                } catch (error) {
                    errorDiv.textContent = 'Network error. Please try again.';
                    errorDiv.style.display = 'block';
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Verify 2FA Code';
                }
                return;
            }
            
            // Normal login flow
            try {
                loginBtn.disabled = true;
                loginBtn.textContent = 'Verifying...';
                
                const response = await fetch(`${API_URL}/auth/login-portal`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, portal: redirectPortal })
                });

                const data = await response.json();

                if (!data.success) {
                    errorDiv.textContent = data.message || 'Login failed';
                    errorDiv.style.display = 'block';
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login';
                    return;
                }
                
                // Check if 2FA is required (ONLY for super_admin)
                if (data.requiresTwoFA && data.sessionId) {
                    isTwoFAMode = true;
                    twofaSessionId = data.sessionId;
                    document.getElementById('twofaGroup').style.display = 'block';
                    infoDiv.textContent = data.message || 'Enter your 2FA secret code to continue.';
                    infoDiv.style.display = 'block';
                    loginBtn.textContent = 'Verify 2FA Code';
                    loginBtn.disabled = false;
                    return;
                }
                
                // No 2FA required - complete login
                if (data.token) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = data.redirectUrl;
                }
                
            } catch (error) {
                errorDiv.textContent = 'Network error. Please try again.';
                errorDiv.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        });
        
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker registered:', reg))
                    .catch(err => console.error('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
