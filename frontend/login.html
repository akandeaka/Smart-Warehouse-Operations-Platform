<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Warehouse Stock System</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WMS">
    <meta name="theme-color" content="#F40009">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #F40009 0%, #CC0000 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            margin: 20px;
            border-top: 5px solid #F40009;
        }
        .login-container h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #1A1A1A;
            font-size: 24px;
        }
        .portal-badge {
            text-align: center;
            margin-bottom: 20px;
            padding: 8px;
            background: #f0f0f0;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        .portal-badge i {
            margin-right: 8px;
        }
        .portal-super-admin { background: #F40009; color: white; }
        .portal-manager { background: #ffc107; color: #333; }
        .portal-sales { background: #28a745; color: white; }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #333;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #F40009 0%, #CC0000 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        button:hover {
            opacity: 0.9;
        }
        .error-msg {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        .info-msg {
            background: #cce5ff;
            color: #004085;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        .logo {
            text-align: center;
            font-size: 64px;
            margin-bottom: 20px;
        }
        .twofa-group {
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🏭</div>
        <div class="portal-badge" id="portalBadge">Loading...</div>
        <h1>Warehouse <span style="color:#F40009">Stock System</span></h1>
        <div class="subtitle" id="portalSubtitle">Login to continue</div>
        <div id="errorMsg" class="error-msg"></div>
        <div id="infoMsg" class="info-msg"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required autocomplete="off">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <div class="form-group twofa-group" id="twofaGroup">
                <label>2FA Secret Code (Super Admin only)</label>
                <input type="password" id="twofaCode" placeholder="Enter your secret code">
            </div>
            <button type="submit" id="loginBtn">Login</button>
        </form>
    </div>

    <script>
        const API_URL = 'https://warehouse-backend-new-u9rq.onrender.com/api';
        
        // Determine which portal we are trying to access based on where we came from
        let redirectPortal = 'sales'; // default
        let twofaSessionId = null;
        
        // Check URL parameters for redirect info
        const urlParams = new URLSearchParams(window.location.search);
        const redirectParam = urlParams.get('redirect');
        
        if (redirectParam === 'super-admin') {
            redirectPortal = 'super-admin';
        } else if (redirectParam === 'manager-dashboard') {
            redirectPortal = 'manager';
        } else {
            // Check referrer to determine portal
            const referrer = document.referrer;
            if (referrer.includes('super-admin')) {
                redirectPortal = 'super-admin';
            } else if (referrer.includes('manager-dashboard')) {
                redirectPortal = 'manager';
            } else {
                redirectPortal = 'sales';
            }
        }
        
        // Update UI based on portal
        const portalBadge = document.getElementById('portalBadge');
        const portalSubtitle = document.getElementById('portalSubtitle');
        
        switch(redirectPortal) {
            case 'super-admin':
                portalBadge.innerHTML = '<i class="fas fa-shield-alt"></i> SUPER ADMIN PORTAL';
                portalBadge.className = 'portal-badge portal-super-admin';
                portalSubtitle.innerHTML = 'Enter your credentials and 2FA code';
                break;
            case 'manager':
                portalBadge.innerHTML = '<i class="fas fa-chart-line"></i> WAREHOUSE MANAGER PORTAL';
                portalBadge.className = 'portal-badge portal-manager';
                portalSubtitle.innerHTML = 'Enter your credentials';
                break;
            default:
                portalBadge.innerHTML = '<i class="fas fa-users"></i> SALES TEAM PORTAL';
                portalBadge.className = 'portal-badge portal-sales';
                portalSubtitle.innerHTML = 'Enter your credentials';
        }
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const twofaCode = document.getElementById('twofaCode').value;
            const errorDiv = document.getElementById('errorMsg');
            const infoDiv = document.getElementById('infoMsg');
            const loginBtn = document.getElementById('loginBtn');
            
            errorDiv.style.display = 'none';
            infoDiv.style.display = 'none';
            
            // Step 1: Initial login
            try {
                loginBtn.disabled = true;
                loginBtn.textContent = 'Verifying...';
                
                const response = await fetch(`${API_URL}/auth/login-portal`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, portal: redirectPortal })
                });

                const data = await response.json();

                if (data.success === false) {
                    errorDiv.textContent = data.message || 'Login failed';
                    errorDiv.style.display = 'block';
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login';
                    return;
                }
                
                // Check if 2FA is required
                if (data.requiresTwoFA && data.sessionId) {
                    twofaSessionId = data.sessionId;
                    document.getElementById('twofaGroup').style.display = 'block';
                    infoDiv.textContent = data.message || '2FA required. Enter your secret code.';
                    infoDiv.style.display = 'block';
                    loginBtn.textContent = 'Verify 2FA Code';
                    loginBtn.disabled = false;
                    return;
                }
                
                // No 2FA required - complete login
                if (data.token) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = data.redirectUrl;
                }
                
            } catch (error) {
                errorDiv.textContent = 'Network error. Please try again.';
                errorDiv.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        });
        
        // Handle 2FA verification separately if we're in 2FA mode
        // This is triggered when the button is clicked again after 2FA is shown
        async function verifyTwoFA() {
            const twofaCode = document.getElementById('twofaCode').value;
            const errorDiv = document.getElementById('errorMsg');
            const loginBtn = document.getElementById('loginBtn');
            
            if (!twofaCode) {
                errorDiv.textContent = 'Please enter your 2FA secret code';
                errorDiv.style.display = 'block';
                return;
            }
            
            try {
                loginBtn.disabled = true;
                loginBtn.textContent = 'Verifying 2FA...';
                
                const response = await fetch(`${API_URL}/auth/verify-2fa`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId: twofaSessionId, secretCode: twofaCode })
                });
                
                const data = await response.json();
                
                if (data.success === false) {
                    errorDiv.textContent = data.message || '2FA verification failed';
                    errorDiv.style.display = 'block';
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Verify 2FA Code';
                    return;
                }
                
                if (data.token) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = data.redirectUrl;
                }
                
            } catch (error) {
                errorDiv.textContent = 'Network error. Please try again.';
                errorDiv.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.textContent = 'Verify 2FA Code';
            }
        }
        
        // Override form submit for 2FA case
        const originalSubmit = document.getElementById('loginForm').onsubmit;
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (twofaSessionId) {
                await verifyTwoFA();
            } else {
                // Let the original handler run
                const event = new Event('submit');
                // This will be handled by the main listener
            }
        });
        
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker registered:', reg))
                    .catch(err => console.error('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
