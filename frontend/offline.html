<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Offline - AKINEX SWOP</title>
    
    <!-- PWA Support -->
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AKINEX SWOP">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <meta name="theme-color" content="#0B2B5C">

    <!-- ====== ADDED: Additional PWA Meta Tags ====== -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="AKINEX SWOP">
    <meta name="msapplication-TileColor" content="#0B2B5C">
    <meta name="msapplication-TileImage" content="/icons/icon-144.png">
    <!-- =========================================== -->

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #2d6a4f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .offline-container {
            background: rgba(255,255,255,0.95);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        [data-theme="dark"] .offline-container {
            background: #1a1a2e;
        }
        .offline-icon { font-size: 80px; margin-bottom: 20px; }
        h1 { color: #0B2B5C; font-size: 28px; margin-bottom: 10px; }
        [data-theme="dark"] h1 { color: #e0e0e0; }
        p { color: #6c757d; font-size: 16px; line-height: 1.6; margin-bottom: 20px; }
        [data-theme="dark"] p { color: #aaaaaa; }
        .btn-retry {
            display: inline-block;
            padding: 14px 40px;
            background: #F40009;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-retry:hover { background: #cc0000; }
        .features {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
        }
        .feature {
            padding: 15px 10px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        [data-theme="dark"] .feature { background: #22224a; }
        .feature .icon { font-size: 30px; }
        .feature .label { font-size: 12px; color: #6c757d; margin-top: 5px; }
        [data-theme="dark"] .feature .label { color: #888888; }
        .last-sync { font-size: 13px; color: #6c757d; margin-top: 10px; }
        [data-theme="dark"] .last-sync { color: #888888; }
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            border: none;
            cursor: pointer;
            font-size: 20px;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            transition: background 0.3s;
            z-index: 100;
        }
        .theme-toggle:hover { background: rgba(255,255,255,0.3); }

        @media (max-width: 480px) {
            .offline-container { padding: 25px; }
            .features { grid-template-columns: 1fr; }
            .offline-icon { font-size: 60px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
        <span id="themeIcon">🌙</span>
    </button>

    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <h1>You're Offline</h1>
        <p>Don't worry! You can still access previously loaded data.<br>Connect to the internet to sync your data.</p>

        <div class="features">
            <div class="feature">
                <div class="icon">📦</div>
                <div class="label">View Products</div>
            </div>
            <div class="feature">
                <div class="icon">👨‍✈️</div>
                <div class="label">Driver Data</div>
            </div>
            <div class="feature">
                <div class="icon">📊</div>
                <div class="label">Sales History</div>
            </div>
        </div>

        <button class="btn-retry" onclick="retryConnection()">🔄 Retry Connection</button>
        <div class="last-sync" id="lastSync">Last synced: Unknown</div>
    </div>

    <script>
        // ============================================================
        // HYBRID DARK MODE
        // ============================================================
        function getSystemTheme() {
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        function getCurrentTheme() {
            const saved = localStorage.getItem('theme');
            return saved ? saved : getSystemTheme();
        }
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            const icon = document.getElementById('themeIcon');
            if (icon) icon.textContent = theme === 'dark' ? '☀️' : '🌙';
        }
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            const newTheme = current === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', newTheme);
            applyTheme(newTheme);
        }
        applyTheme(getCurrentTheme());

        function retryConnection() {
            if (navigator.onLine) {
                window.location.href = '/';
            } else {
                alert('📡 Still offline. Please check your internet connection.');
            }
        }

        const lastSync = localStorage.getItem('lastSyncTime');
        if (lastSync) {
            document.getElementById('lastSync').textContent = 
                'Last synced: ' + new Date(parseInt(lastSync)).toLocaleString();
        }

        window.addEventListener('online', () => {
            window.location.href = '/';
        });
    </script>
</body>
</html>
