<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Sales Team Dashboard</title>
    
    <!-- PWA Support -->
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WMS">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <meta name="theme-color" content="#667eea">
    
    <style>
        /* ============================================================
           LIGHT MODE (Default)
           ============================================================ */
        :root {
            --bg-body: #f5f5f5;
            --bg-card: #ffffff;
            --bg-header: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-light: #999999;
            --border-color: #ddd;
            --shadow: 0 2px 5px rgba(0,0,0,0.1);
            --table-header: #f8f9fa;
            --input-bg: #ffffff;
            --input-border: #ddd;
            --tab-bg: #f0f0f0;
            --tab-active: #667eea;
            --success-bg: #d4edda;
            --success-text: #155724;
            --error-bg: #f8d7da;
            --error-text: #721c24;
            --warning-bg: #fff3cd;
            --warning-text: #856404;
            --info-bg: #cce5ff;
            --info-text: #004085;
            --credit-amount: #dc3545;
            --status-confirmed: #28a745;
            --status-pending: #dc3545;
            --btn-confirm: #28a745;
            --btn-submit: #ffc107;
            --btn-sell: #667eea;
        }

        /* ============================================================
           DARK MODE (Hybrid)
           ============================================================ */
        [data-theme="dark"] {
            --bg-body: #1a1a2e;
            --bg-card: #2d2d2d;
            --bg-header: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            --text-primary: #e0e0e0;
            --text-secondary: #aaaaaa;
            --text-light: #888888;
            --border-color: #444;
            --shadow: 0 2px 5px rgba(0,0,0,0.5);
            --table-header: #3d3d3d;
            --input-bg: #3d3d3d;
            --input-border: #555;
            --tab-bg: #3d3d3d;
            --tab-active: #667eea;
            --success-bg: #1a3a1a;
            --success-text: #8bc34a;
            --error-bg: #3a1a1a;
            --error-text: #ff6b6b;
            --warning-bg: #3a2a1a;
            --warning-text: #ffc107;
            --info-bg: #1a2a4a;
            --info-text: #8ab4f8;
            --credit-amount: #ff6b6b;
            --status-confirmed: #8bc34a;
            --status-pending: #ff6b6b;
            --btn-confirm: #28a745;
            --btn-submit: #ffc107;
            --btn-sell: #667eea;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            transition: background 0.3s ease, color 0.3s ease;
        }
        
        /* Dark Mode Toggle Button */
        .theme-toggle {
            background: rgba(255,255,255,0.2);
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            transition: background 0.3s ease;
            margin-right: 10px;
        }
        .theme-toggle:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .header {
            background: var(--bg-header);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            transition: background 0.3s ease;
        }
        
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            padding: 20px;
        }
        .stat-card {
            background: var(--bg-card);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: var(--shadow);
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }
        .stat-card .label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }
        .stat-card .value {
            font-size: 22px;
            font-weight: bold;
            color: var(--tab-active);
        }
        .stat-card .credit-value {
            font-size: 22px;
            font-weight: bold;
            color: var(--credit-amount);
        }
        .card {
            background: var(--bg-card);
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
            box-shadow: var(--shadow);
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }
        .card h3 {
            margin-bottom: 15px;
            color: var(--text-primary);
            border-left: 4px solid var(--tab-active);
            padding-left: 12px;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .product-item {
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            background: var(--tab-bg);
            transition: border-color 0.3s ease, background 0.3s ease;
        }
        .product-item h4 { color: var(--text-primary); margin-bottom: 10px; }
        .product-item .price { color: var(--tab-active); font-weight: bold; font-size: 20px; }
        .product-item .stock { color: var(--text-secondary); font-size: 14px; margin: 5px 0; }
        .product-item .total-value { color: var(--tab-active); font-weight: bold; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-color); }
        
        .confirm-btn {
            background: var(--btn-confirm);
            color: white;
            border: none;
            padding: 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            width: 100%;
            margin-top: 15px;
            transition: background 0.3s;
        }
        .confirm-btn:hover { background: #218838; }
        .confirm-btn:disabled { background: #6c757d; cursor: not-allowed; opacity: 0.7; }
        
        .submit-btn {
            background: var(--btn-submit);
            color: #333;
            border: none;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            width: calc(100% - 40px);
            margin: 0 20px 20px 20px;
            transition: all 0.3s;
        }
        [data-theme="dark"] .submit-btn { color: #333; }
        .submit-btn:disabled {
            background: #6c757d !important;
            color: white !important;
            cursor: not-allowed !important;
            opacity: 0.7 !important;
        }
        
        .sell-btn {
            background: var(--btn-sell);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            transition: background 0.3s;
        }
        .sell-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
            opacity: 0.7;
        }
        
        .logout-btn, .refresh-btn {
            background: rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
            border: none;
            color: white;
        }
        .download-btn { background: #17a2b8; color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; margin: 10px; }
        .form-group { margin-bottom: 15px; }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: var(--text-primary);
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--input-border);
            border-radius: 5px;
            background: var(--input-bg);
            color: var(--text-primary);
            transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }
        .payment-options {
            display: flex;
            gap: 15px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .payment-options label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        .success-msg, .error-msg, .warning-msg, .info-msg {
            padding: 12px;
            margin: 0 20px;
            border-radius: 5px;
            display: none;
        }
        .success-msg { background: var(--success-bg); color: var(--success-text); }
        .error-msg { background: var(--error-bg); color: var(--error-text); }
        .warning-msg { background: var(--warning-bg); color: var(--warning-text); }
        .info-msg { background: var(--info-bg); color: var(--info-text); }
        
        table {
            width: 100%;
            margin-top: 15px;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            transition: border-color 0.3s ease;
        }
        th {
            background: var(--table-header);
            color: var(--text-primary);
            transition: background 0.3s ease, color 0.3s ease;
        }
        .loading { text-align: center; padding: 40px; color: var(--text-secondary); }
        .allocation-summary {
            background: var(--tab-bg);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            transition: background 0.3s ease;
        }
        .total-goods-value { font-size: 24px; font-weight: bold; color: var(--tab-active); }
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            transition: border-color 0.3s ease;
        }
        .tab-btn {
            background: none;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            color: var(--text-secondary);
        }
        .tab-btn.active {
            color: var(--tab-active);
            border-bottom: 2px solid var(--tab-active);
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .zero-state { text-align: center; padding: 40px; color: var(--tab-active); font-size: 18px; }
        .history-item {
            background: var(--tab-bg);
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 3px solid var(--tab-active);
            transition: background 0.3s ease;
        }
        .history-date {
            font-weight: bold;
            color: var(--tab-active);
            margin-bottom: 10px;
        }

        /* Credit Status Styles */
        .status-pending { background-color: var(--warning-bg); }
        .status-approved { background-color: var(--success-bg); }
        .status-due {
            background-color: var(--error-bg);
            animation: blink 1s infinite;
        }
        .status-rejected {
            background-color: var(--tab-bg);
            color: var(--text-secondary);
            opacity: 0.7;
        }
        .status-paid { background-color: var(--info-bg); }

        @keyframes blink {
            0% { background-color: var(--error-bg); }
            50% { background-color: var(--error-bg); opacity: 0.6; }
            100% { background-color: var(--error-bg); }
        }

        .credit-amount {
            color: var(--credit-amount);
            font-weight: bold;
        }
        .credit-amount::before { content: "- "; }
        .credit-amount.paid { color: #28a745; }
        .credit-amount.paid::before { content: "✅ "; }

        .btn-pay {
            animation: blink 1s infinite;
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            background: #F40009;
        }
        .btn-pay:hover { background: #cc0000; }
        .credit-amount.pending { color: #ffc107; }

        .team-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: var(--tab-active);
            color: white;
        }
        .batch-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            background: #17a2b8;
            color: white;
            margin-left: 5px;
        }

        @media screen and (max-width: 768px) {
            .header { flex-direction: column; text-align: center; gap: 15px; padding: 15px; }
            .stats-container { grid-template-columns: 1fr; gap: 10px; padding: 10px; }
            .stat-card { padding: 12px; }
            .stat-card .value { font-size: 20px; }
            .card { padding: 12px; margin: 10px; }
            .product-grid { grid-template-columns: 1fr; gap: 10px; }
            .product-item { padding: 10px; }
            table { display: block; overflow-x: auto; white-space: nowrap; font-size: 12px; }
            th, td { padding: 8px; min-width: 80px; }
            .btn-allocate, .btn-approve, .btn-reject, .close-day-btn, .submit-btn, .confirm-btn { width: 100%; padding: 10px; font-size: 14px; }
            td button { display: block; width: 100%; margin: 3px 0; }
            .tab-buttons { flex-wrap: wrap; }
            .tab-btn { padding: 6px 12px; font-size: 12px; }
            .submit-btn { width: calc(100% - 20px); margin: 0 10px 10px 10px; font-size: 14px; }
        }

        @media (hover: none) and (pointer: coarse) {
            button, .tab, .btn-allocate, .btn-approve, .btn-reject, .logout-btn, .refresh-btn, .confirm-btn, .submit-btn {
                min-height: 44px;
                min-width: 44px;
            }
            input, select { min-height: 44px; font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>💰 <span id="teamName">Sales Team</span> Dashboard <span id="teamBadge" class="team-badge"></span></h1>
        <div>
            <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme" style="background:rgba(255,255,255,0.2); border:none; cursor:pointer; font-size:18px; color:white; padding:8px 12px; border-radius:5px; margin-right:10px;">
                <span id="themeIcon">🌙</span>
            </button>
            <span id="dateDisplay" style="margin-right: 15px; font-size: 14px;"></span>
            <button class="refresh-btn" onclick="refreshData()">🔄 Refresh</button>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <!-- [ALL YOUR EXISTING HTML CONTENT HERE - STATS, CARDS, FORMS, TABLES, ETC.] -->

    <script>
        // ============================================================
        // HYBRID DARK MODE
        // ============================================================
        function getSystemTheme() {
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function getCurrentTheme() {
            const saved = localStorage.getItem('theme');
            if (saved) return saved;
            return getSystemTheme();
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            const icon = document.getElementById('themeIcon');
            if (icon) {
                icon.textContent = theme === 'dark' ? '☀️' : '🌙';
            }
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            const newTheme = current === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', newTheme);
            applyTheme(newTheme);
        }

        // Initialize
        applyTheme(getCurrentTheme());

        // Listen for system changes (only if user hasn't saved preference)
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            const saved = localStorage.getItem('theme');
            if (!saved) {
                applyTheme(e.matches ? 'dark' : 'light');
            }
        });

        // ============================================================
        // [YOUR EXISTING JAVASCRIPT CODE HERE - ALL FUNCTIONS REMAIN UNCHANGED]
        // ============================================================

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker registered:', reg))
                    .catch(err => console.error('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
