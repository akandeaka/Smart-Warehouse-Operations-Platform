<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Team Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
        }

        .header {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: bold;
            color: #28a745;
        }

        .card {
            background: white;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .product-item {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .payment-options {
            display: flex;
            gap: 15px;
            margin: 15px 0;
        }

        button.sell-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }

        .logout-btn {
            background: rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        .success-msg {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            margin: 0 20px;
            border-radius: 5px;
            display: none;
        }

        table {
            width: 100%;
            margin-top: 15px;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>💰 Alpha Team Dashboard</h1>
        <div class="logout-btn" onclick="logout()">Logout</div>
    </div>

    <div class="stats-container">
        <div class="stat-card">
            <div>Today's Sales</div>
            <div class="value" id="todaySales">₦0</div>
        </div>
        <div class="stat-card">
            <div>Items Sold</div>
            <div class="value" id="itemsSold">0</div>
        </div>
    </div>

    <div id="successMsg" class="success-msg"></div>

    <div class="card">
        <h3>📦 My Allocated Stock</h3>
        <div id="allocatedStock" class="product-grid"></div>
    </div>

    <div class="card">
        <h3>➕ Record New Sale</h3>
        <form id="saleForm">
            <div class="form-group">
                <label>Customer Name</label>
                <input type="text" id="customerName" required>
            </div>
            <div class="form-group">
                <label>Product</label>
                <select id="productSelect" required></select>
            </div>
            <div class="form-group">
                <label>Quantity</label>
                <input type="number" id="quantity" min="1" required>
            </div>
            <div class="payment-options">
                <label><input type="radio" name="paymentMethod" value="cash" checked> 💵 Cash</label>
                <label><input type="radio" name="paymentMethod" value="transfer"> 🏦 Bank Transfer</label>
                <label><input type="radio" name="paymentMethod" value="credit"> 📝 Credit</label>
            </div>
            <button type="submit" class="sell-btn">Sell Now</button>
        </form>
    </div>

    <div class="card">
        <h3>📊 Today's Sales History</h3>
        <table id="salesHistory">
            <thead><tr><th>Time</th><th>Customer</th><th>Product</th><th>Qty</th><th>Amount</th></tr></thead>
            <tbody id="salesHistoryBody"></tbody>
        </table>
    </div>

    <script>
        let allocatedStock = [
            {id: 1, name: 'Premium Rice', qty: 50, price: 4200},
            {id: 2, name: 'Vegetable Oil', qty: 30, price: 2300}
        ];
        
        let salesHistory = [];
        let totalSales = 0;
        let totalItems = 0;

        function loadAllocatedStock() {
            let container = document.getElementById('allocatedStock');
            let select = document.getElementById('productSelect');
            
            let html = '';
            let selectHtml = '<option value="">Select Product</option>';
            
            allocatedStock.forEach(p => {
                html += `<div class="product-item">
                    <h4>${p.name}</h4>
                    <div>Available: ${p.qty} units</div>
                    <div>Price: ₦${p.price.toLocaleString()}</div>
                </div>`;
                selectHtml += `<option value="${p.id}" data-price="${p.price}" data-name="${p.name}">${p.name} - ₦${p.price}</option>`;
            });
            
            container.innerHTML = html;
            select.innerHTML = selectHtml;
        }

        document.getElementById('saleForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            let customerName = document.getElementById('customerName').value;
            let productSelect = document.getElementById('productSelect');
            let productId = parseInt(productSelect.value);
            let quantity = parseInt(document.getElementById('quantity').value);
            let paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
            
            if (!productId) {
                alert('Please select a product');
                return;
            }
            
            let product = allocatedStock.find(p => p.id === productId);
            
            if (quantity > product.qty) {
                alert(`Only ${product.qty} units available`);
                return;
            }
            
            let totalAmount = quantity * product.price;
            
            // Record sale
            salesHistory.unshift({
                time: new Date().toLocaleTimeString(),
                customer: customerName,
                product: product.name,
                quantity: quantity,
                amount: totalAmount
            });
            
            // Update stock
            product.qty -= quantity;
            totalSales += totalAmount;
            totalItems += quantity;
            
            // Update UI
            updateStats();
            updateSalesHistory();
            loadAllocatedStock();
            
            let methodText = paymentMethod === 'cash' ? 'Cash' : (paymentMethod === 'transfer' ? 'Transfer' : 'Credit');
            showMessage(`✅ Sale recorded! ₦${totalAmount.toLocaleString()} (${methodText})`);
            
            // Reset form
            document.getElementById('customerName').value = '';
            document.getElementById('quantity').value = '';
            document.getElementById('productSelect').value = '';
        });
        
        function updateStats() {
            document.getElementById('todaySales').innerHTML = `₦${totalSales.toLocaleString()}`;
            document.getElementById('itemsSold').innerHTML = totalItems;
        }
        
        function updateSalesHistory() {
            let tbody = document.getElementById('salesHistoryBody');
            if (salesHistory.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5">No sales yet today</td></tr>';
                return;
            }
            
            let html = '';
            salesHistory.forEach(s => {
                html += `<tr>
                    <td>${s.time}</td>
                    <td>${s.customer}</td>
                    <td>${s.product}</td>
                    <td>${s.quantity}</td>
                    <td>₦${s.amount.toLocaleString()}</td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }
        
        function showMessage(msg) {
            let msgDiv = document.getElementById('successMsg');
            msgDiv.innerHTML = msg;
            msgDiv.style.display = 'block';
            setTimeout(() => {
                msgDiv.style.display = 'none';
            }, 3000);
        }
        
        function logout() {
            window.location.href = 'login.html';
        }
        
        loadAllocatedStock();
        updateStats();
    </script>
</body>
</html>
