<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Performance Dashboard</title>
    
    <!-- PWA Support -->
    <link rel="manifest" href="/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WMS">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <meta name="theme-color" content="#667eea">
    
    <style>
        /* ============================================================
           LIGHT MODE (Default)
           ============================================================ */
        :root {
            --bg-body: #f5f5f5;
            --bg-card: #ffffff;
            --bg-header: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-light: #999999;
            --border-color: #ddd;
            --shadow: 0 2px 5px rgba(0,0,0,0.1);
            --table-header: #f8f9fa;
            --input-bg: #ffffff;
            --input-border: #ddd;
            --tab-bg: #f0f0f0;
            --tab-active: #667eea;
            --success-text: #155724;
            --error-text: #721c24;
            --positive: #28a745;
            --negative: #dc3545;
            --progress-bg: #e0e0e0;
            --progress-fill: #28a745;
            --rank-1-bg: #fff8e1;
        }

        /* ============================================================
           DARK MODE (Hybrid)
           ============================================================ */
        [data-theme="dark"] {
            --bg-body: #1a1a2e;
            --bg-card: #2d2d2d;
            --bg-header: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            --text-primary: #e0e0e0;
            --text-secondary: #aaaaaa;
            --text-light: #888888;
            --border-color: #444;
            --shadow: 0 2px 5px rgba(0,0,0,0.5);
            --table-header: #3d3d3d;
            --input-bg: #3d3d3d;
            --input-border: #555;
            --tab-bg: #3d3d3d;
            --tab-active: #667eea;
            --success-text: #8bc34a;
            --error-text: #ff6b6b;
            --positive: #8bc34a;
            --negative: #ff6b6b;
            --progress-bg: #444;
            --progress-fill: #8bc34a;
            --rank-1-bg: #2a2a1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            transition: background 0.3s ease, color 0.3s ease;
        }
        
        /* Dark Mode Toggle Button */
        .theme-toggle {
            background: rgba(255,255,255,0.2);
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            transition: background 0.3s ease;
            margin-right: 10px;
        }
        .theme-toggle:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .header {
            background: var(--bg-header);
            color: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            transition: background 0.3s ease;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            padding: 20px;
        }
        .stat-card {
            background: var(--bg-card);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: var(--shadow);
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }
        .stat-card .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 5px; }
        .stat-card .value { font-size: 24px; font-weight: bold; color: var(--tab-active); }
        .stat-card .trend { font-size: 12px; margin-top: 5px; }
        .stat-card .trend.positive { color: var(--positive); }
        .stat-card .trend.negative { color: var(--negative); }
        
        .card {
            background: var(--bg-card);
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
            box-shadow: var(--shadow);
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            transition: border-color 0.3s ease;
        }
        th {
            background: var(--table-header);
            color: var(--text-primary);
            transition: background 0.3s ease, color 0.3s ease;
        }
        .loading { text-align: center; padding: 40px; color: var(--text-secondary); }
        
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            transition: border-color 0.3s ease;
        }
        .tab-btn {
            background: none;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            color: var(--text-secondary);
        }
        .tab-btn.active {
            color: var(--tab-active);
            border-bottom: 2px solid var(--tab-active);
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .logout-btn, .refresh-btn, .back-btn {
            background: rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            border: none;
            color: white;
            margin-left: 10px;
        }
        .download-btn {
            background: #17a2b8;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }
        .positive { color: var(--positive); }
        .negative { color: var(--negative); }
        .no-data-text { text-align: center; padding: 20px; color: var(--text-light); }
        .error-text { text-align: center; padding: 20px; color: var(--negative); }
        
        .progress-bar {
            background: var(--progress-bg);
            border-radius: 10px;
            height: 8px;
            width: 100px;
            overflow: hidden;
            display: inline-block;
            vertical-align: middle;
            transition: background 0.3s ease;
        }
        .progress-fill {
            background: var(--progress-fill);
            height: 100%;
            border-radius: 10px;
            transition: background 0.3s ease;
        }
        .rank-1 { background-color: var(--rank-1-bg); }
        
        @media screen and (max-width: 768px) {
            .stats-container { grid-template-columns: 1fr; }
            table { display: block; overflow-x: auto; white-space: nowrap; font-size: 12px; }
            th, td { padding: 8px; min-width: 80px; }
            .tab-btn { padding: 6px 12px; font-size: 12px; }
            .header { flex-direction: column; text-align: center; gap: 15px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 Manager Performance Dashboard</h1>
        <div class="header-actions">
            <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
                <span id="themeIcon">🌙</span>
            </button>
            <button class="refresh-btn" onclick="refreshData()">🔄 Refresh</button>
            <button class="back-btn" onclick="goBack()">← Back to Dashboard</button>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <!-- [ALL YOUR EXISTING HTML CONTENT HERE - STATS, TABLES, ETC.] -->

    <script>
        // ============================================================
        // HYBRID DARK MODE
        // ============================================================
        function getSystemTheme() {
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function getCurrentTheme() {
            const saved = localStorage.getItem('theme');
            if (saved) return saved;
            return getSystemTheme();
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            const icon = document.getElementById('themeIcon');
            if (icon) {
                icon.textContent = theme === 'dark' ? '☀️' : '🌙';
            }
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            const newTheme = current === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', newTheme);
            applyTheme(newTheme);
        }

        // Initialize
        applyTheme(getCurrentTheme());

        // Listen for system changes (only if user hasn't saved preference)
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            const saved = localStorage.getItem('theme');
            if (!saved) {
                applyTheme(e.matches ? 'dark' : 'light');
            }
        });

        // ============================================================
        // [YOUR EXISTING JAVASCRIPT CODE HERE - ALL FUNCTIONS REMAIN UNCHANGED]
        // ============================================================

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker registered:', reg))
                    .catch(err => console.error('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
