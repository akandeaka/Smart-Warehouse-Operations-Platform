<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Performance Dashboard</title>
    
    <!-- PWA Support -->
    <link rel="manifest" href="/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WMS">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <meta name="theme-color" content="#667eea">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; padding: 20px; }
        .stat-card { background: white; padding: 15px; border-radius: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .stat-card .label { font-size: 12px; color: #666; margin-bottom: 5px; }
        .stat-card .value { font-size: 24px; font-weight: bold; color: #667eea; }
        .stat-card .trend { font-size: 12px; margin-top: 5px; }
        .stat-card .trend.positive { color: #28a745; }
        .stat-card .trend.negative { color: #dc3545; }
        .card { background: white; padding: 20px; margin: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f8f9fa; }
        .loading { text-align: center; padding: 40px; color: #666; }
        .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #ddd; flex-wrap: wrap; }
        .tab-btn { background: none; border: none; padding: 10px 20px; cursor: pointer; font-size: 16px; color: #666; }
        .tab-btn.active { color: #667eea; border-bottom: 2px solid #667eea; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .logout-btn, .refresh-btn, .back-btn { background: rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 5px; cursor: pointer; border: none; color: white; margin-left: 10px; }
        .download-btn { background: #17a2b8; color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; margin: 10px; }
        .positive { color: #28a745; }
        .negative { color: #dc3545; }
        .no-data-text { text-align: center; padding: 20px; color: #999; }
        .progress-bar { background: #e0e0e0; border-radius: 10px; height: 8px; width: 100px; overflow: hidden; display: inline-block; vertical-align: middle; }
        .progress-fill { background: #667eea; height: 100%; border-radius: 10px; }
        .rank-1 { background-color: #fff8e1; }
        @media screen and (max-width: 768px) {
            .stats-container { grid-template-columns: 1fr; }
            table { display: block; overflow-x: auto; white-space: nowrap; font-size: 12px; }
            th, td { padding: 8px; min-width: 80px; }
            .tab-btn { padding: 6px 12px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 Manager Performance Dashboard</h1>
        <div>
            <button class="refresh-btn" onclick="refreshData()">🔄 Refresh</button>
            <button class="back-btn" onclick="goBack()">← Back to Dashboard</button>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <div id="errorMsg" style="background:#f8d7da; color:#721c24; padding:12px; margin:20px; border-radius:5px; display:none;"></div>
    <div id="successMsg" style="background:#d4edda; color:#155724; padding:12px; margin:20px; border-radius:5px; display:none;"></div>

    <div class="card" style="margin-bottom:0;">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
            <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
                <span>📅 Select Date:</span>
                <input type="date" id="dateSelector" value="">
                <button class="download-btn" onclick="loadAllData()">Load Report</button>
            </div>
            <button class="download-btn" onclick="downloadReport()">📥 Download CSV</button>
        </div>
    </div>

    <div class="stats-container" id="statsContainer">
        <div class="stat-card"><div class="label">Total Sales</div><div class="value" id="totalSales">₦0</div><div class="trend" id="totalSalesTrend"></div></div>
        <div class="stat-card"><div class="label">Total Units Sold</div><div class="value" id="totalUnits">0</div><div class="trend" id="totalUnitsTrend"></div></div>
        <div class="stat-card"><div class="label">Total Orders</div><div class="value" id="totalOrders">0</div><div class="trend" id="totalOrdersTrend"></div></div>
        <div class="stat-card"><div class="label">Avg Order Value</div><div class="value" id="avgOrderValue">₦0</div></div>
    </div>

    <div class="card">
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('team')">🏆 Team Performance</button>
            <button class="tab-btn" onclick="switchTab('product')">📦 Product Performance</button>
            <button class="tab-btn" onclick="switchTab('comparison')">📈 Comparison</button>
        </div>

        <div id="tab-team" class="tab-content active">
            <div id="teamLoading" class="loading">Loading team performance...</div>
            <div id="teamTableWrapper" style="display:none; overflow-x:auto;">
                <table style="width:100%;">
                    <thead><tr><th>Rank</th><th>Team</th><th>Orders</th><th>Units</th><th>Total Sales</th><th>%</th></tr></thead>
                    <tbody id="teamTableBody"></tbody>
                </table>
            </div>
        </div>

        <div id="tab-product" class="tab-content">
            <div id="productLoading" class="loading">Loading product performance...</div>
            <div id="productTableWrapper" style="display:none; overflow-x:auto;">
                <table style="width:100%;">
                    <thead><tr><th>Rank</th><th>Product</th><th>Units Sold</th><th>Total Revenue</th><th>% of Sales</th></tr></thead>
                    <tbody id="productTableBody"></tbody>
                </table>
            </div>
        </div>

        <div id="tab-comparison" class="tab-content">
            <div id="comparisonLoading" class="loading">Loading comparison data...</div>
            <div id="comparisonContent"></div>
        </div>
    </div>

    <script>
        const API_URL = 'https://warehouse-backend-new-u9rq.onrender.com/api';
        let authToken = localStorage.getItem('token');
        let currentUser = JSON.parse(localStorage.getItem('user') || '{}');
        let currentDate = new Date().toISOString().split('T')[0];
        let teamData = [];
        let productData = [];
        let summaryData = {};

        document.getElementById('dateSelector').value = currentDate;

        function formatMoney(amount) {
            let num = parseFloat(amount);
            if (isNaN(num)) return '₦0';
            return '₦' + Math.round(num).toLocaleString('en-NG');
        }

        function showMessage(msg, isError = false) {
            const msgDiv = document.getElementById(isError ? 'errorMsg' : 'successMsg');
            msgDiv.innerHTML = msg;
            msgDiv.style.display = 'block';
            setTimeout(() => { msgDiv.style.display = 'none'; }, 3000);
        }

        async function fetchAPI(endpoint) {
            try {
                const response = await fetch(API_URL + endpoint, {
                    headers: { 'Authorization': 'Bearer ' + authToken }
                });
                if (response.status === 401) { localStorage.clear(); window.location.href = 'login.html'; return null; }
                return await response.json();
            } catch (error) { 
                showMessage('Network error: ' + error.message, true); 
                return null; 
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
            event.target.classList.add('active');
        }

        // ============================================================
        // LOAD TEAM PERFORMANCE (FIXED)
        // ============================================================
        async function loadTeamPerformance() {
            const loadingDiv = document.getElementById('teamLoading');
            const tableWrapper = document.getElementById('teamTableWrapper');
            
            loadingDiv.style.display = 'block';
            tableWrapper.style.display = 'none';
            
            try {
                const data = await fetchAPI('/manager/team-performance?date=' + currentDate);
                
                if (data && data.success && data.data && data.data.length > 0) {
                    teamData = data.data;
                    
                    // Calculate totals
                    let totalSales = 0, totalUnits = 0, totalOrders = 0;
                    teamData.forEach(t => {
                        totalSales += parseFloat(t.total_sales) || 0;
                        totalUnits += parseInt(t.total_units) || 0;
                        totalOrders += parseInt(t.orders) || 0;
                    });
                    
                    summaryData = { total_sales: totalSales, total_units: totalUnits, total_orders: totalOrders };
                    
                    document.getElementById('totalSales').innerHTML = formatMoney(totalSales);
                    document.getElementById('totalUnits').innerHTML = totalUnits;
                    document.getElementById('totalOrders').innerHTML = totalOrders;
                    document.getElementById('avgOrderValue').innerHTML = formatMoney(totalOrders > 0 ? totalSales / totalOrders : 0);
                    
                    let html = '';
                    for (let i = 0; i < teamData.length; i++) {
                        let t = teamData[i];
                        let percent = totalSales > 0 ? (t.total_sales / totalSales * 100) : 0;
                        html += `<tr class="${i === 0 ? 'rank-1' : ''}">
                            <td><strong>#${i+1}</strong> ${i === 0 ? '🏆' : ''}</td>
                            <td><strong>${t.team_name || 'Unknown'}</strong></td>
                            <td>${t.orders || 0}</td>
                            <td>${t.total_units || 0}</td>
                            <td><strong>${formatMoney(t.total_sales)}</strong></td>
                            <td>
                                <div class="progress-bar"><div class="progress-fill" style="width: ${Math.min(percent, 100)}%;"></div></div>
                                ${percent.toFixed(1)}%
                            </td>
                        </tr>`;
                    }
                    document.getElementById('teamTableBody').innerHTML = html;
                    loadingDiv.style.display = 'none';
                    tableWrapper.style.display = 'block';
                } else {
                    loadingDiv.innerHTML = '<div class="no-data-text">No team performance data available</div>';
                }
            } catch (error) {
                console.error('Error loading team performance:', error);
                loadingDiv.innerHTML = '<div class="error-text">Error loading data</div>';
            }
        }

        // ============================================================
        // LOAD PRODUCT PERFORMANCE (FIXED)
        // ============================================================
        async function loadProductPerformance() {
            const loadingDiv = document.getElementById('productLoading');
            const tableWrapper = document.getElementById('productTableWrapper');
            
            loadingDiv.style.display = 'block';
            tableWrapper.style.display = 'none';
            
            try {
                const data = await fetchAPI('/manager/product-performance?date=' + currentDate);
                
                if (data && data.success && data.data && data.data.length > 0) {
                    productData = data.data;
                    
                    let totalRevenue = productData.reduce((sum, p) => sum + (parseFloat(p.total_revenue) || 0), 0);
                    
                    let html = '';
                    for (let i = 0; i < productData.length; i++) {
                        let p = productData[i];
                        let percent = totalRevenue > 0 ? (p.total_revenue / totalRevenue * 100) : 0;
                        html += `<tr>
                            <td><strong>#${i+1}</strong> ${i === 0 ? '🏆' : ''}</td>
                            <td><strong>${p.product_name || 'Unknown'}</strong></td>
                            <td>${p.total_sold || 0}</td>
                            <td>${formatMoney(p.total_revenue)}</td>
                            <td>
                                <div class="progress-bar"><div class="progress-fill" style="width: ${Math.min(percent, 100)}%;"></div></div>
                                ${percent.toFixed(1)}%
                            </td>
                        </tr>`;
                    }
                    document.getElementById('productTableBody').innerHTML = html;
                    loadingDiv.style.display = 'none';
                    tableWrapper.style.display = 'block';
                } else {
                    loadingDiv.innerHTML = '<div class="no-data-text">No product performance data available</div>';
                }
            } catch (error) {
                console.error('Error loading product performance:', error);
                loadingDiv.innerHTML = '<div class="error-text">Error loading data</div>';
            }
        }

        // ============================================================
        // LOAD COMPARISON (FIXED)
        // ============================================================
        async function loadComparisonData() {
            const loadingDiv = document.getElementById('comparisonLoading');
            const container = document.getElementById('comparisonContent');
            
            loadingDiv.style.display = 'block';
            container.innerHTML = '';
            
            try {
                const prevDate = new Date(currentDate);
                prevDate.setDate(prevDate.getDate() - 1);
                const prevDateStr = prevDate.toISOString().split('T')[0];
                
                const [current, previous] = await Promise.all([
                    fetchAPI('/manager/team-performance?date=' + currentDate),
                    fetchAPI('/manager/team-performance?date=' + prevDateStr)
                ]);
                
                const curTotal = { total_sales: 0, total_units: 0, total_orders: 0 };
                const prevTotal = { total_sales: 0, total_units: 0, total_orders: 0 };
                
                if (current && current.success && current.data) {
                    current.data.forEach(t => {
                        curTotal.total_sales += parseFloat(t.total_sales) || 0;
                        curTotal.total_units += parseInt(t.total_units) || 0;
                        curTotal.total_orders += parseInt(t.orders) || 0;
                    });
                }
                
                if (previous && previous.success && previous.data) {
                    previous.data.forEach(t => {
                        prevTotal.total_sales += parseFloat(t.total_sales) || 0;
                        prevTotal.total_units += parseInt(t.total_units) || 0;
                        prevTotal.total_orders += parseInt(t.orders) || 0;
                    });
                }
                
                const salesChange = curTotal.total_sales - prevTotal.total_sales;
                const salesPercent = prevTotal.total_sales > 0 ? (salesChange / prevTotal.total_sales * 100) : 0;
                const unitsChange = curTotal.total_units - prevTotal.total_units;
                const unitsPercent = prevTotal.total_units > 0 ? (unitsChange / prevTotal.total_units * 100) : 0;
                const ordersChange = curTotal.total_orders - prevTotal.total_orders;
                const ordersPercent = prevTotal.total_orders > 0 ? (ordersChange / prevTotal.total_orders * 100) : 0;
                
                // Update trend indicators
                document.getElementById('totalSalesTrend').innerHTML = `${salesChange >= 0 ? '▲' : '▼'} ${formatMoney(Math.abs(salesChange))} (${salesPercent.toFixed(1)}%)`;
                document.getElementById('totalSalesTrend').className = `trend ${salesChange >= 0 ? 'positive' : 'negative'}`;
                document.getElementById('totalUnitsTrend').innerHTML = `${unitsChange >= 0 ? '▲' : '▼'} ${Math.abs(unitsChange)} (${unitsPercent.toFixed(1)}%)`;
                document.getElementById('totalUnitsTrend').className = `trend ${unitsChange >= 0 ? 'positive' : 'negative'}`;
                document.getElementById('totalOrdersTrend').innerHTML = `${ordersChange >= 0 ? '▲' : '▼'} ${Math.abs(ordersChange)} (${ordersPercent.toFixed(1)}%)`;
                document.getElementById('totalOrdersTrend').className = `trend ${ordersChange >= 0 ? 'positive' : 'negative'}`;
                
                let html = `<div style="background:#e8f5e9; padding:15px; border-radius:8px; margin-bottom:20px;">
                    <strong>📈 Day vs Previous Day</strong><br>${currentDate} vs ${prevDateStr}
                </div>
                <table style="width:100%">
                    <thead><tr><th>Metric</th><th>${currentDate}</th><th>${prevDateStr}</th><th>Change</th></tr></thead>
                    <tbody>
                        <tr><td>Total Sales</td><td>${formatMoney(curTotal.total_sales)}</td><td>${formatMoney(prevTotal.total_sales)}</td><td class="${salesChange >= 0 ? 'positive' : 'negative'}">${salesChange >= 0 ? '+' : ''}${formatMoney(salesChange)} (${salesPercent.toFixed(1)}%)</td></tr>
                        <tr><td>Units Sold</td><td>${curTotal.total_units || 0}</td><td>${prevTotal.total_units || 0}</td><td class="${unitsChange >= 0 ? 'positive' : 'negative'}">${unitsChange >= 0 ? '+' : ''}${unitsChange} (${unitsPercent.toFixed(1)}%)</td></tr>
                        <tr><td>Orders</td><td>${curTotal.total_orders || 0}</td><td>${prevTotal.total_orders || 0}</td><td class="${ordersChange >= 0 ? 'positive' : 'negative'}">${ordersChange >= 0 ? '+' : ''}${ordersChange} (${ordersPercent.toFixed(1)}%)</td></tr>
                    </tbody>
                </table>`;
                
                if (current && current.success && current.data && current.data.length) {
                    const sorted = [...current.data].sort((a,b) => (b.total_sales || 0) - (a.total_sales || 0));
                    const best = sorted[0];
                    const worst = sorted[sorted.length - 1];
                    html += `<div style="margin-top:20px;">
                        <div style="background:#e8f5e9; padding:15px; border-radius:8px; margin-bottom:10px;">🏆 Best Team: ${best.team_name} - ${formatMoney(best.total_sales)}</div>
                        <div style="background:#fff3cd; padding:15px; border-radius:8px;">⚠️ Needs Improvement: ${worst.team_name} - ${formatMoney(worst.total_sales)}</div>
                    </div>`;
                }
                
                container.innerHTML = html;
                loadingDiv.style.display = 'none';
            } catch (error) {
                console.error('Error loading comparison:', error);
                loadingDiv.innerHTML = '<div class="error-text">Error loading comparison data</div>';
            }
        }

        function downloadReport() {
            if (!teamData.length && !productData.length) { showMessage('No data to download', true); return; }
            let csv = `Performance Report for ${currentDate}\n\n`;
            csv += `Team,Orders,Units Sold,Total Sales\n`;
            teamData.forEach(t => csv += `"${t.team_name}",${t.orders || 0},${t.total_units || 0},${t.total_sales || 0}\n`);
            csv += `\nProduct,Units Sold,Total Revenue\n`;
            productData.forEach(p => csv += `"${p.product_name}",${p.total_sold || 0},${p.total_revenue || 0}\n`);
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `performance_${currentDate}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showMessage('Download started!');
        }

        async function loadAllData() {
            currentDate = document.getElementById('dateSelector').value;
            await loadTeamPerformance();
            await loadProductPerformance();
            await loadComparisonData();
            showMessage(`Loaded data for ${currentDate}`);
        }

        async function refreshData() { await loadAllData(); }
        function goBack() { window.location.href = 'manager-dashboard.html'; }
        function logout() { localStorage.clear(); window.location.href = 'login.html'; }

        // Initialize
        if (!authToken) window.location.href = 'login.html';
        else loadAllData();

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker registered:', reg))
                    .catch(err => console.error('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
